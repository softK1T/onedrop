[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrop"
version = "0.1.0"
description = "OneDrop backend: AI-powered Telegram life planner"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy==2.0.35",
  "alembic==1.13.3",
  "asyncpg==0.29.0",
  "greenlet==3.1.1",
  "redis==5.0.8",
  "arq==0.26.1",
  "aiogram==3.13.1",
  "httpx==0.27.2",
  "structlog==24.4.0",
  "PyJWT==2.9.0",
  "python-multipart==0.0.10",
  "boto3==1.35.24",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.8",
  "mypy==1.11.2",
  "types-python-dateutil==2.9.0.20240906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["arq.*", "boto3.*", "botocore.*", "aiogram.*", "structlog.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires PostgreSQL and Redis",
  "e2e: end-to-end acceptance scenario",
]
