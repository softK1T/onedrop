name: onedrop

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-32-chars-minimum}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onedrop}:${POSTGRES_PASSWORD:-onedrop}@postgres:5432/${POSTGRES_DB:-onedrop}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-onedrop}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-onedrop-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-onedrop-media}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:-http://localhost:5173}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,https://web.telegram.org}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  BOT_MODE: ${BOT_MODE:-polling}
  AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-fake}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  STT_API_KEY: ${STT_API_KEY:-}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Warsaw}
  DEFAULT_BASE_CURRENCY: ${DEFAULT_BASE_CURRENCY:-PLN}

x-backend: &backend
  build: { context: ./backend }
  image: onedrop-backend:local
  environment: *backend-env
  restart: unless-stopped
  depends_on: { migrate: { condition: service_completed_successfully } }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onedrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onedrop}
      POSTGRES_DB: ${POSTGRES_DB:-onedrop}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onedrop} -d ${POSTGRES_DB:-onedrop}"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-onedrop}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-onedrop-dev-secret}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
    restart: unless-stopped
  migrate:
    build: { context: ./backend }
    image: onedrop-backend:local
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    <<: *backend
    command: ["uvicorn", "onedrop.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
  bot:
    <<: *backend
    command: ["python", "-m", "onedrop.bot.run"]
  worker:
    <<: *backend
    command: ["arq", "onedrop.workers.settings.WorkerSettings"]
    depends_on: { redis: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
  scheduler:
    <<: *backend
    command: ["python", "-m", "onedrop.workers.scheduler"]
  frontend:
    build: { context: ./frontend }
    image: onedrop-frontend:local
    ports: ["${FRONTEND_PORT:-5173}:8080"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on: { api: { condition: service_started } }
    restart: unless-stopped

volumes: { postgres-data: {}, redis-data: {}, minio-data: {} }
