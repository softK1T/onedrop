name: onedrop

# Runtime values belong in .env. Defaults retain the no-credential demo mode.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:-http://localhost:5173}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://onedrop:onedrop@postgres:5432/onedrop}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-onedrop}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-onedrop-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-onedrop-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  BOT_MODE: ${BOT_MODE:-polling}
  AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-fake}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
  STT_API_KEY: ${STT_API_KEY:-}
  STT_BASE_URL: ${STT_BASE_URL:-https://api.openai.com/v1}
  STT_MODEL: ${STT_MODEL:-whisper-1}
  VISION_MODEL: ${VISION_MODEL:-openai/gpt-4o-mini}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
  AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.55}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Warsaw}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
  DEFAULT_BASE_CURRENCY: ${DEFAULT_BASE_CURRENCY:-PLN}
  FREE_ONBOARDING_BONUS: ${FREE_ONBOARDING_BONUS:-15}
  FREE_DAILY_AI_LIMIT: ${FREE_DAILY_AI_LIMIT:-3}
  PRO_MONTHLY_AI_LIMIT: ${PRO_MONTHLY_AI_LIMIT:-1000}
  PRO_PRICE_STARS: ${PRO_PRICE_STARS:-250}
  PRO_PERIOD_DAYS: ${PRO_PERIOD_DAYS:-30}
  REMINDER_MAX_ATTEMPTS: ${REMINDER_MAX_ATTEMPTS:-5}
  REMINDER_BASE_DELAY_SECONDS: ${REMINDER_BASE_DELAY_SECONDS:-60}
  REMINDER_MAX_DELAY_SECONDS: ${REMINDER_MAX_DELAY_SECONDS:-3600}
  REMINDER_LOCK_TIMEOUT_SECONDS: ${REMINDER_LOCK_TIMEOUT_SECONDS:-300}
  REMINDER_CLAIM_LIMIT: ${REMINDER_CLAIM_LIMIT:-25}

x-backend: &backend
  build:
    context: ./backend
  image: onedrop-backend:local
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onedrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onedrop}
      POSTGRES_DB: ${POSTGRES_DB:-onedrop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onedrop} -d ${POSTGRES_DB:-onedrop}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-onedrop}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-onedrop-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  migrate:
    build:
      context: ./backend
    image: onedrop-backend:local
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    command:
      [
        "uvicorn",
        "onedrop.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *backend
    command: ["python", "-m", "onedrop.bot.run"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["arq", "onedrop.workers.settings.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: ["python", "-m", "onedrop.workers.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    image: onedrop-frontend:local
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  minio-data:
