name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onedrop
          POSTGRES_PASSWORD: onedrop
          POSTGRES_DB: onedrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onedrop -d onedrop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret-key-0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://onedrop:onedrop@localhost:5432/onedrop_test
      REDIS_URL: redis://localhost:6379/1
      TELEGRAM_BOT_TOKEN: "123456:ci-placeholder-token"
      AI_PROVIDER_MODE: fake
      DEV_LOGIN_ENABLED: "true"
      DEFAULT_TIMEZONE: Europe/Warsaw
      DEFAULT_BASE_CURRENCY: PLN

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pinned dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration consistency check
        run: python scripts/check_migrations.py

      - name: pytest
        run: pytest -q
