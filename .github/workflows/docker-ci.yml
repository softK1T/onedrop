name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate and smoke-test Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet

      - name: Verify pinned MinIO healthcheck dependency
        run: |
          docker pull minio/minio:RELEASE.2024-09-13T20-26-02Z
          docker run --rm --entrypoint sh minio/minio:RELEASE.2024-09-13T20-26-02Z -c 'command -v curl'

      - name: Start Compose stack
        run: docker compose --env-file .env.example up --build --wait --wait-timeout 180

      - name: Verify API health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health

      - name: Show Compose diagnostics
        if: always()
        run: |
          docker compose --env-file .env.example ps
          docker compose --env-file .env.example logs --no-color --tail=200

      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (api, bot, worker, scheduler share it)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: onedrop-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime entry points
        run: |
          docker run --rm onedrop-backend:ci python -c "import onedrop.main; import onedrop.bot.run; import onedrop.workers.settings; import onedrop.workers.scheduler; print('entry points import cleanly')"
          docker run --rm onedrop-backend:ci sh -c 'id -u | grep -qv "^0$" && echo "container runs as non-root"'
